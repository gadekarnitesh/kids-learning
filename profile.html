<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let’s Begin · Kids Learning</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/profile.css"></head><body class="home-page"><main class="welcome-card profile-card"><div class="brand-mark">👋</div><h1>Let’s learn!</h1><p class="intro">Tell us a little about the learner. No password needed.</p><form id="profile-form"><label>Your name <input id="name" required maxlength="30" autocomplete="given-name" placeholder=""></label><label>Your age <input id="age" required type="number" min="2" max="12" inputmode="numeric" placeholder="e.g. 2"></label><button class="class-button" type="submit">Start learning →</button></form></main><script>const classId=new URLSearchParams(location.search).get('class');if(!classId)location.replace('index.html');const form=document.getElementById('profile-form'),nameInput=document.getElementById('name'),ageInput=document.getElementById('age'),sampleNames=['Anvi','Riddhesh','Arav','Viraj','Aarya','Shourya','Shahu','Mokshad','Swayam','Gargi','Kadambari','Gauri','Abhay','Gayatri','Mansvi','Aakanksha','Astha','Mayur'];nameInput.placeholder=`e.g. ${sampleNames[Math.floor(Math.random()*sampleNames.length)]}`;form.addEventListener('submit',event=>{event.preventDefault();sessionStorage.setItem('kidsLearningProfile',JSON.stringify({name:nameInput.value.trim(),age:ageInput.value,classId,startedAt:Date.now(),activities:{}}));location.assign(`class-landing.html?class=${encodeURIComponent(classId)}`)});</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/effects.css?v=3"><style>.big-order{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:28px auto}.big-order button,.blank-question button{width:112px;height:100px;border:3px solid #d9e5ef;border-radius:15px;background:#fff;font-size:45px;font-weight:700;color:#243252;box-shadow:0 4px 0 #cbdde9;cursor:pointer}.blank-list{display:grid;gap:20px;max-width:600px;margin:25px auto}.blank-question{padding:22px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #d9eaf3;font-size:31px}.letter-line{display:flex;align-items:center;justify-content:center;gap:14px}.blank-slot{display:inline-grid;place-items:center;width:58px;height:48px;color:#ff7699;border-bottom:4px solid #ff7699}.game-start{margin:12px;border:0;border-radius:16px;padding:14px 30px;background:#7657dd;color:#fff;font-size:23px;font-weight:700;box-shadow:0 5px 0 #48389d;cursor:pointer}.game-field{position:relative;height:350px;max-width:700px;margin:20px auto;border-radius:25px;background:linear-gradient(#96dcff,#edfaff);overflow:hidden}.balloon{position:absolute;left:calc(var(--x) * 1%);bottom:-130px;width:96px;height:120px;border:0;border-radius:52% 52% 48% 48%;cursor:pointer;animation:rise 5.2s linear forwards;filter:drop-shadow(0 6px 3px #3346)}.balloon:after{content:"";position:absolute;left:43px;bottom:-26px;width:2px;height:30px;background:#546070}.balloon-red{background:#ef4f67}.balloon-blue{background:#4c9df3}.balloon-yellow{background:#ffd540}.balloon-green{background:#54c977}.balloon.pop-correct{animation:correct-pop .4s ease-out forwards;background:#fff}.balloon.pop-correct:before{content:"✨";font-size:58px}.balloon.pop-wrong{animation:wrong-pop .4s ease-out forwards;background:#8894a4}.game-field.wrong-flash{animation:wrong-flash .35s}@keyframes rise{to{bottom:110%;transform:rotate(8deg)}}@keyframes correct-pop{to{transform:scale(2);opacity:0}}@keyframes wrong-pop{35%{transform:translateX(-18px)}70%{transform:translateX(18px)}to{opacity:0}}@keyframes wrong-flash{50%{background:#ffd6de}}</style></head>
<body class="frame-page"><div id="activity-root" class="activity-root" aria-live="polite"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jsPlumb/2.15.6/js/jsplumb.min.js"></script>
<script>
  const activityParams = new URLSearchParams(location.search), type = activityParams.get('type') || 'reveal', file = activityParams.get('file') || 'alphabets';
  window.activityMode = activityParams.get('mode') || 'learn';
  const learnerClass = activityParams.get('class') === 'sr' ? 'sr' : 'jr';
  const typeFolders = {pairs:'match-the-pair',drag:'drag-drop',reveal:'click-reveal',sequence:'sequence-ordering',blanks:'fill-in-the-blanks',count:'counting',connect:'connect-numbers',sequenceconnect:'connect-numbers',numberbins:'number-bins',math:'math-drag',numberpick:'number-pick',game:'games'};
  const scriptNames = {pairs:'matchpairs',drag:'dragdrop',reveal:'clickreveal',sequence:'sequenceordering',blanks:'fillblanks',count:'countdrag',connect:'numberconnect',sequenceconnect:'sequenceconnect',numberbins:'numberbins',math:'mathdrag',numberpick:'numberpick',game:'games'};
  window.activityDataUrl = `data/${learnerClass}/${activityParams.get('week') || 'week-1'}/${typeFolders[type] || 'click-reveal'}/${file}.json`;
  window.activityImageUrl = 'assets/images/learning-bus.png';
  window.activityTracker = { start(label) { const p=JSON.parse(sessionStorage.getItem('kidsLearningProfile')||'null'); if(!p)return; const key=`${type}:${file}:${window.activityMode}`; p.activities[key] ||= {label,seconds:0,retries:0}; p.activities[key].openedAt=Date.now(); sessionStorage.setItem('kidsLearningProfile',JSON.stringify(p)); }, retry() { const p=JSON.parse(sessionStorage.getItem('kidsLearningProfile')||'null'); if(!p)return; const key=`${type}:${file}:${window.activityMode}`, a=p.activities[key]; if(a){a.retries++;sessionStorage.setItem('kidsLearningProfile',JSON.stringify(p));} }, finish() { const p=JSON.parse(sessionStorage.getItem('kidsLearningProfile')||'null'); if(!p)return; const key=`${type}:${file}:${window.activityMode}`, a=p.activities[key]; if(a&&a.openedAt){a.seconds+=Math.round((Date.now()-a.openedAt)/1000);delete a.openedAt;sessionStorage.setItem('kidsLearningProfile',JSON.stringify(p));} } }; window.activityTracker.start(activityParams.get('label') || file); window.addEventListener('pagehide',()=>window.activityTracker.finish());
  
  const assetVersion = '20260906-1';
  document.write(`<link rel="stylesheet" href="assets/css/counting.css?v=${assetVersion}">`);
  document.write(`<link rel="stylesheet" href="assets/css/connect-numbers.css?v=${assetVersion}">`);
  document.write(`<link rel="stylesheet" href="assets/css/math-drag.css?v=${assetVersion}">`);
  document.write(`<link rel="stylesheet" href="assets/css/number-pick.css?v=${assetVersion}">`);
  document.write(`<link rel="stylesheet" href="assets/css/number-bins.css?v=${assetVersion}">`);
  document.write('<script src="assets/js/fun-effects.js"><\/script>');
  document.write(`<script src="assets/js/${scriptNames[type] || 'clickreveal'}.js?v=${assetVersion}"><\/script>`);
</script></body></html>

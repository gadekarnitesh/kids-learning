<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Summary</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/profile.css"></head><body class="home-page"><main class="welcome-card summary-card"><div class="brand-mark">🌟</div><h1 id="title">Learning summary</h1><p class="intro">A gentle snapshot of today’s learning.</p><div id="summary"></div><a class="class-button" href="index.html" id="done">Done</a></main><script>const p=JSON.parse(sessionStorage.getItem('kidsLearningProfile')||'null'),s=document.getElementById('summary');if(!p)location.replace('index.html');else{title.textContent=`${p.name}'s learning summary`;const a=Object.values(p.activities||{}),mins=Math.max(1,Math.round((Date.now()-p.startedAt)/60000));s.innerHTML=`<p><strong>${a.length}</strong> activities explored · <strong>${mins}</strong> minutes of learning</p><ul>${a.map(x=>`<li>${x.label}: ${Math.max(1,Math.round(x.seconds/60))} min · ${x.retries||0} retry${x.retries===1?'':'ies'}</li>`).join('')||'<li>Come back after exploring an activity!</li>'}</ul>`;done.onclick=()=>sessionStorage.removeItem('kidsLearningProfile')}</script></body></html>
